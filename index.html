<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WooCommerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <h1 class="logo">My<span>Shop</span></h1>
            <nav>
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">Account</a></li>
                    <li><a href="#">Cart</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Product Grid -->
    <section class="products">
        <div class="container">
            <h2 class="section-title">আমাদের প্রোডাক্টসমূহ</h2>
            <div class="grid">
                <!-- Product 1 -->
                <div class="product-card">
                    <img src="https://via.placeholder.com/250" alt="Product">
                    <h3>প্রিমিয়াম গেমিং মাউস</h3>
                    <p class="price">৳ ১,২০০</p>
                    <button class="add-to-cart">অর্ডার করুন</button>
                </div>
                <!-- Product 2 -->
                <div class="product-card">
                    <img src="https://via.placeholder.com/250" alt="Product">
                    <h3>ওয়্যারলেস হেডফোন</h3>
                    <p class="price">৳ ২,৫০০</p>
                    <button class="add-to-cart">অর্ডার করুন</button>
                </div>
                <!-- Product 3 -->
                <div class="product-card">
                    <img src="https://via.placeholder.com/250" alt="Product">
                    <h3>স্মার্ট ওয়াচ</h3>
                    <p class="price">৳ ৩,০০০</p>
                    <button class="add-to-cart">অর্ডার করুন</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 Md Arafat Hosen | সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

</body>
</html>
